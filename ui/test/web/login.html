<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Example Mail</title></head><body>
<header><nav><a href="/">Example Mail</a> <a href="/pricing">Pricing</a> <a href="/help">Help</a> <a href="/signup">Create account</a></nav></header>
<h1>Sign in</h1>
<p>Use your Example account. Not you? <a href="/switch">Switch account</a>.</p>
<form action="/login" method="post">
<input type="hidden" name="csrf" value="x">
<label for="em">Email</label>
<input id="em" type="email" name="email" placeholder="you@example.com">
<label for="pw">Password</label>
<input id="pw" type="password" name="password" placeholder="Password">
<p><input type="checkbox" id="rm" name="remember"> <label for="rm">Keep me signed in</label></p>
<p>Language: <select name="lang"><option>English</option><option>Deutsch</option><option>Español</option></select></p>
<p><input type="radio" name="plan" id="p1" value="free" checked> <label for="p1">Free</label> <input type="radio" name="plan" id="p2" value="pro"> <label for="p2">Pro</label></p>
<input type="submit" value="Sign in">
</form>
<p><a href="/forgot">Forgot password?</a></p>
<h2>Send feedback</h2>
<form action="/feedback" method="post"><textarea name="msg" placeholder="Tell us what went wrong"></textarea><button type="submit">Send</button></form>
<p><small>By signing in you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</small></p>
</body></html>
